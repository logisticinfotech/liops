{{define "content"}}
<h1>Create the admin account</h1>
<form method="post" action="/setup/admin" class="panel">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <label for="username">Username</label>
  <input type="text" id="username" name="username" autocomplete="username" autofocus required>
  <div class="row">
    <div><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="new-password" minlength="12" required></div>
    <div><label for="confirm">Password again</label><input type="password" id="confirm" name="confirm" autocomplete="new-password" minlength="12" required></div>
  </div>
  <div class="hint">At least 12 characters. Next you set up an authenticator app; a code is required at every login.</div>
  <div class="actions"><button>Create and continue</button></div>
</form>
{{end}}
