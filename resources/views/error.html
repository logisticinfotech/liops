{{define "content"}}{{with .Data}}
<h1>{{.What}}</h1>
<div class="error">
  {{if .Reason}}<p><strong>Likely reason:</strong> {{.Reason}}.</p>{{end}}
  <details><summary>Technical details</summary><pre>{{.Detail}}</pre></details>
</div>
<p><button type="button" class="secondary" data-back>Go back</button> or <a href="/">open the status page</a>.</p>
{{end}}{{end}}
