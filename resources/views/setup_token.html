{{define "content"}}
<h1>Set up pgtijori</h1>
<form method="post" action="/setup/token" class="panel">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <p>Enter the setup token the installer printed. To see it again, run on the server:</p>
  <pre>sudo pgtijori setup-token</pre>
  <label for="token">Setup token</label>
  <input type="text" id="token" name="token" class="mono" autocomplete="off" autofocus required placeholder="XXXXXX-XXXXXX-XXXXXX-XXXXXX">
  <div class="actions"><button>Continue</button></div>
</form>
{{end}}
