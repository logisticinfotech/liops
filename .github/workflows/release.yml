# SPDX-License-Identifier: Apache-2.0
#
# Pushing a tag like v1.2.0 builds the binary and publishes a GitHub Release with:
#   pgtijori-linux-amd64, install.sh (once it exists), SHA256SUMS
# Releases are only ever created by this workflow.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Unit tests
        run: go test -race -count=1 ./...

      - name: Build
        run: |
          mkdir dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w \
              -X github.com/logisticinfotech/pgtijori/app/version.Version=${GITHUB_REF_NAME} \
              -X github.com/logisticinfotech/pgtijori/app/version.Commit=${GITHUB_SHA::7}" \
            -o dist/pgtijori-linux-amd64 .
          if [ -f scripts/install.sh ]; then cp scripts/install.sh dist/install.sh; fi
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
