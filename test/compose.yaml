# SPDX-License-Identifier: Apache-2.0
#
# Test environment: PostgreSQL 18 + pgBackRest, MinIO as an S3 stand-in for R2, and
# Mailpit as an SMTP server that catches every email. MySQL 8.4 is in the "mysql"
# profile, so the PostgreSQL tests don't start it. Everything here is test-only:
# credentials are fixed, and the TLS certificate is self-signed and generated when the
# environment starts. The pg container trusts it, so TLS verification stays on.
#
#   ./test/smoke.sh                                    start and check
#   ./test/integration.sh                              setup, backups, dumps, emails, restores
#   ./test/integration-mysql.sh                        the same for MySQL (dumps, users, restores)
#   docker compose -f test/compose.yaml --profile mysql down -v   stop and delete everything
name: liops-test

services:
  certs:
    image: alpine:3.22
    volumes:
      - certs:/certs
    command:
      - sh
      - -c
      - >-
        [ -f /certs/public.crt ] && exit 0;
        apk add --no-cache openssl >/dev/null &&
        openssl req -x509 -newkey rsa:2048 -nodes -days 30
        -subj /CN=minio
        -addext "subjectAltName=DNS:minio,DNS:mailpit,DNS:localhost,IP:127.0.0.1"
        -keyout /certs/private.key -out /certs/public.crt 2>/dev/null &&
        chmod 644 /certs/private.key /certs/public.crt

  minio:
    # MinIO removed its images from Docker Hub; Chainguard builds the same server from
    # source. Its image runs as uid 65532, which can't create /data, so run as root.
    # If it ever disappears, swap in another S3-compatible server.
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    command: server /data --certs-dir /certs --console-address :9001
    environment:
      MINIO_ROOT_USER: liops-test
      MINIO_ROOT_PASSWORD: liops-test-secret
    volumes:
      - certs:/certs:ro
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    depends_on:
      certs:
        condition: service_completed_successfully

  # Creates the test bucket (pgBackRest doesn't create buckets), then exits.
  bucket:
    # The -dev variant has a shell for the wait loop below.
    image: cgr.dev/chainguard/minio-client:latest-dev
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        until mc alias set t https://minio:9000 liops-test liops-test-secret --insecure >/dev/null 2>&1;
        do sleep 1; done;
        mc mb --ignore-existing --insecure t/liops-test
    depends_on:
      - minio

  mailpit:
    image: axllent/mailpit:v1.21.0
    environment:
      MP_SMTP_TLS_CERT: /certs/public.crt
      MP_SMTP_TLS_KEY: /certs/private.key
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
    volumes:
      - certs:/certs:ro
    ports:
      - "127.0.0.1:8025:8025"
    depends_on:
      certs:
        condition: service_completed_successfully

  pg:
    build: docker/pg
    volumes:
      - certs:/certs:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "/var/run/postgresql"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      certs:
        condition: service_completed_successfully
      minio:
        condition: service_started
      bucket:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  mysql:
    build: docker/mysql
    profiles: [mysql]
    volumes:
      - certs:/certs:ro
    depends_on:
      certs:
        condition: service_completed_successfully
      minio:
        condition: service_started
      bucket:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

volumes:
  certs:
